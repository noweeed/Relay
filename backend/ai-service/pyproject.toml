[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "relay-ai-service"
version = "0.1.0"
description = "Python AI worker for Relay"
requires-python = ">=3.12"
dependencies = [
  "groq>=0.31",
  "httpx>=0.28",
  "langgraph>=0.6",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "redis>=6.4",
  "pymongo>=4.14"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
  "mypy>=1.17"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["relay_ai"]
